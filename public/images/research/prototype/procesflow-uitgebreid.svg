<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 740" font-family="Kalam, 'Patrick Hand', system-ui, sans-serif">
  <defs>
    <marker id="ug-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2D2938" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Subtle background zones -->
  <!-- Happy path band -->
  <rect x="0" y="300" width="1920" height="140" fill="#FEF3E7" opacity="0.45"/>
  <!-- Error zone (bottom) -->
  <rect x="640" y="470" width="260" height="260" fill="#F5F0EA" opacity="0.7" rx="16"/>
  <!-- Exception zone (top) -->
  <rect x="980" y="60" width="220" height="130" fill="#F5F0EA" opacity="0.7" rx="16"/>

  <!-- ================= MAIN ROW (cy=370) ================= -->

  <!-- Start (pill) -->
  <rect x="20" y="335" width="110" height="70" rx="35" fill="#F59E0B" stroke="#F59E0B" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="75" y="377" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Start</text>

  <line x1="130" y1="370" x2="170" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>

  <!-- Aanmelding -->
  <rect x="170" y="325" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="245" y="376" text-anchor="middle" font-size="16" fill="#2D2938">Aanmelding</text>

  <line x1="320" y1="370" x2="360" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>

  <!-- Identificatie -->
  <rect x="360" y="325" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="435" y="376" text-anchor="middle" font-size="16" fill="#2D2938">Identificatie</text>

  <line x1="510" y1="370" x2="550" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>

  <!-- Persoonlijke identificatie invoeren -->
  <rect x="550" y="325" width="210" height="90" rx="12" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="655" y="363" text-anchor="middle" font-size="15" fill="#2D2938">Persoonlijke</text>
  <text x="655" y="383" text-anchor="middle" font-size="15" fill="#2D2938">identificatie invoeren</text>

  <line x1="760" y1="370" x2="800" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>

  <!-- Authenticatie (diamond) -->
  <polygon points="870,310 930,370 870,430 810,370" fill="#FEF3E7" stroke="#F59E0B" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="870" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#2D2938">Authenticatie</text>

  <line x1="930" y1="370" x2="970" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
  <!-- Ja-label pill -->
  <rect x="938" y="346" width="26" height="18" rx="9" fill="#2D2938"/>
  <text x="951" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Ja</text>

  <!-- Ondertekenen -->
  <rect x="970" y="325" width="160" height="90" rx="12" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1050" y="376" text-anchor="middle" font-size="16" fill="#2D2938">Ondertekenen</text>

  <line x1="1130" y1="370" x2="1170" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>

  <!-- Validatie (diamond) -->
  <polygon points="1230,310 1290,370 1230,430 1170,370" fill="#FEF3E7" stroke="#F59E0B" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="1230" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#2D2938">Validatie</text>

  <line x1="1290" y1="370" x2="1335" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
  <!-- goedkeuring-label -->
  <rect x="1289" y="346" width="86" height="18" rx="9" fill="#2D2938"/>
  <text x="1332" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">goedkeuring</text>

  <!-- Koppelen aan ... -->
  <rect x="1335" y="325" width="180" height="90" rx="12" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1425" y="369" text-anchor="middle" font-size="15" fill="#2D2938">Koppelen aan</text>
  <text x="1425" y="389" text-anchor="middle" font-size="15" fill="#2D2938">document</text>

  <line x1="1515" y1="370" x2="1555" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>

  <!-- Bevestiging (diamond) -->
  <polygon points="1615,310 1675,370 1615,430 1555,370" fill="#FEF3E7" stroke="#F59E0B" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="1615" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#2D2938">Bevestiging</text>

  <line x1="1675" y1="370" x2="1715" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
  <rect x="1683" y="346" width="26" height="18" rx="9" fill="#2D2938"/>
  <text x="1696" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Ja</text>

  <!-- Sealed -->
  <rect x="1715" y="325" width="120" height="90" rx="12" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1775" y="376" text-anchor="middle" font-size="16" fill="#2D2938">Sealed</text>

  <line x1="1835" y1="370" x2="1870" y2="370" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>

  <!-- Einde proces (pill) -->
  <rect x="1870" y="335" width="40" height="70" rx="35" fill="#F59E0B" stroke="#F59E0B" stroke-width="2" filter="url(#soft-shadow)"/>
  <circle cx="1890" cy="370" r="10" fill="#FFFFFF"/>
  <text x="1890" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#2D2938">Einde</text>

  <!-- ================= BRANCH 1: Authenticatie "Nee" ================= -->

  <!-- Arrow Auth -> Fout -->
  <line x1="870" y1="430" x2="870" y2="480" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
  <rect x="880" y="445" width="34" height="18" rx="9" fill="#2D2938"/>
  <text x="897" y="459" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Nee</text>

  <!-- Foutafhandeling diamond -->
  <polygon points="870,480 935,545 870,610 805,545" fill="#FEF3E7" stroke="#F59E0B" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="870" y="541" text-anchor="middle" font-size="14" font-weight="600" fill="#2D2938">Fout-</text>
  <text x="870" y="559" text-anchor="middle" font-size="14" font-weight="600" fill="#2D2938">afhandeling</text>

  <!-- Arrow Fout -> Deactivatie (+3 pogingen) -->
  <line x1="870" y1="610" x2="870" y2="635" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
  <rect x="880" y="610" width="90" height="18" rx="9" fill="#2D2938"/>
  <text x="925" y="624" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">+3 pogingen</text>

  <!-- Deactivatie -->
  <rect x="795" y="635" width="150" height="55" rx="12" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="870" y="670" text-anchor="middle" font-size="16" fill="#2D2938">Deactivatie</text>

  <!-- Arrow Deact -> Einde (right side) -->
  <path d="M 945 662 L 980 662 L 980 405" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#ug-arrow)"/>
  <text x="1000" y="530" text-anchor="start" font-size="11" font-style="italic" fill="#2D2938">einde proces</text>

  <!-- Loop <=3 pogingen: from Fout back to Persoonlijke -->
  <path d="M 805 545 L 655 545 L 655 415" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
  <rect x="675" y="536" width="100" height="18" rx="9" fill="#2D2938"/>
  <text x="725" y="550" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">&lt;=3 pogingen</text>

  <!-- ================= BRANCH 2: Afwijkend proces (top) ================= -->

  <!-- Afwijkend proces box -->
  <rect x="1000" y="100" width="180" height="75" rx="12" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1090" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#2D2938">Afwijkend</text>
  <text x="1090" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#2D2938">proces</text>

  <!-- Arrow Validatie -> Afwijkend (Afkeur) -->
  <path d="M 1230 310 L 1230 230 L 1130 230 L 1130 175" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
  <rect x="1145" y="221" width="54" height="18" rx="9" fill="#2D2938"/>
  <text x="1172" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Afkeur</text>

  <!-- Arrow Ondertekenen -> Afwijkend (Fraude signalementen) -->
  <path d="M 1050 325 L 1050 220 L 1050 220 L 1050 175" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#ug-arrow)"/>
  <rect x="1060" y="246" width="130" height="18" rx="9" fill="#2D2938" opacity="0.85"/>
  <text x="1125" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">fraude signalementen</text>

  <!-- ================= BRANCH 3: Bevestiging "Nee" loop back ================= -->

  <path d="M 1615 430 L 1615 470 L 1425 470 L 1425 415" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
  <rect x="1506" y="461" width="26" height="18" rx="9" fill="#2D2938"/>
  <text x="1519" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Nee</text>

  <!-- ================= Legend ================= -->
  <g transform="translate(20, 670)">
    <rect x="0" y="0" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#2D2938" stroke-width="1.5"/>
    <text x="28" y="12" font-size="12" fill="#2D2938">Actie</text>

    <polygon points="100,7 110,0 120,7 110,14" fill="#FEF3E7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="128" y="12" font-size="12" fill="#2D2938">Beslissing</text>

    <rect x="210" y="0" width="18" height="14" rx="7" fill="#F59E0B"/>
    <text x="236" y="12" font-size="12" fill="#2D2938">Start / Einde</text>

    <line x1="325" y1="7" x2="355" y2="7" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ug-arrow)"/>
    <text x="365" y="12" font-size="12" fill="#2D2938">Primaire flow</text>

    <line x1="475" y1="7" x2="505" y2="7" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#ug-arrow)"/>
    <text x="515" y="12" font-size="12" fill="#2D2938">Uitzondering</text>
  </g>
</svg>
