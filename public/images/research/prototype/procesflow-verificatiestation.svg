<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#1a1a1a" font-size="18" font-weight="bold">Verificatieproces bij fysieke ondertekening</text>
  <text x="480" y="50" text-anchor="middle" fill="#888" font-size="11">Huidig proces vs. nieuw concept met verificatiestation</text>

  <!-- ===== TOP ROW: HUIDIGE SITUATIE ===== -->
  <text x="30" y="85" fill="#666" font-size="10" font-weight="bold" letter-spacing="1">HUIDIGE SITUATIE</text>
  <line x1="30" y1="90" x2="930" y2="90" stroke="#ddd"/>

  <!-- Stap 1 -->
  <rect x="30" y="100" width="140" height="65" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="100" y="122" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">Persoon meldt zich</text>
  <text x="100" y="138" text-anchor="middle" fill="#888" font-size="9">bij balie/loket</text>
  <text x="100" y="152" text-anchor="middle" fill="#888" font-size="9">(notaris/gemeente/bank)</text>

  <line x1="170" y1="132" x2="195" y2="132" stroke="#888" marker-end="url(#arr)"/>

  <!-- Stap 2 -->
  <rect x="200" y="100" width="140" height="65" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="270" y="122" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">Medewerker bekijkt</text>
  <text x="270" y="138" text-anchor="middle" fill="#888" font-size="9">ID-bewijs met het oog</text>
  <text x="270" y="152" text-anchor="middle" fill="#888" font-size="9">"ja, lijkt op u"</text>

  <line x1="340" y1="132" x2="365" y2="132" stroke="#888" marker-end="url(#arr)"/>

  <!-- Stap 3 -->
  <rect x="370" y="100" width="140" height="65" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="440" y="122" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">Handtekening zetten</text>
  <text x="440" y="138" text-anchor="middle" fill="#888" font-size="9">op papier met pen</text>
  <text x="440" y="152" text-anchor="middle" fill="#888" font-size="9">(niet vergeleken)</text>

  <line x1="510" y1="132" x2="535" y2="132" stroke="#888" marker-end="url(#arr)"/>

  <!-- Stap 4 -->
  <rect x="540" y="100" width="140" height="65" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="610" y="122" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">Kopie document</text>
  <text x="610" y="138" text-anchor="middle" fill="#888" font-size="9">fysiek archief</text>
  <text x="610" y="152" text-anchor="middle" fill="#888" font-size="9">(verliesbaar)</text>

  <line x1="680" y1="132" x2="705" y2="132" stroke="#888" marker-end="url(#arr)"/>

  <!-- Probleem -->
  <rect x="710" y="100" width="220" height="65" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-dasharray="4,2"/>
  <text x="820" y="118" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">Zwaktes:</text>
  <text x="820" y="134" text-anchor="middle" fill="#b91c1c" font-size="9">Visuele ID-check is subjectief</text>
  <text x="820" y="148" text-anchor="middle" fill="#b91c1c" font-size="9">Handtekening is niet geverifieerd</text>
  <text x="820" y="160" text-anchor="middle" fill="#b91c1c" font-size="9">Papier = geen digitaal bewijs</text>

  <!-- ===== BOTTOM ROW: NIEUW CONCEPT ===== -->
  <text x="30" y="215" fill="#166534" font-size="10" font-weight="bold" letter-spacing="1">NIEUW: VERIFICATIESTATION OP LOCATIE</text>
  <line x1="30" y1="220" x2="930" y2="220" stroke="#bbf7d0"/>

  <!-- Stap 1 -->
  <rect x="30" y="235" width="130" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="95" y="257" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">1. Aanmelden</text>
  <line x1="40" y1="265" x2="150" y2="265" stroke="#dcfce7"/>
  <text x="95" y="280" text-anchor="middle" fill="#555" font-size="9">Persoon meldt zich</text>
  <text x="95" y="293" text-anchor="middle" fill="#555" font-size="9">bij loket (zelfde</text>
  <text x="95" y="306" text-anchor="middle" fill="#555" font-size="9">als nu)</text>

  <line x1="160" y1="275" x2="185" y2="275" stroke="#22c55e" marker-end="url(#arr-g)"/>

  <!-- Stap 2 -->
  <rect x="190" y="235" width="130" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="255" y="257" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">2. ID scannen</text>
  <line x1="200" y1="265" x2="310" y2="265" stroke="#dcfce7"/>
  <text x="255" y="280" text-anchor="middle" fill="#555" font-size="9">Leg ID-bewijs op</text>
  <text x="255" y="293" text-anchor="middle" fill="#555" font-size="9">station. NFC-chip</text>
  <text x="255" y="306" text-anchor="middle" fill="#555" font-size="9">wordt gelezen.</text>

  <line x1="320" y1="275" x2="345" y2="275" stroke="#22c55e" marker-end="url(#arr-g)"/>

  <!-- Stap 3 -->
  <rect x="350" y="235" width="130" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="415" y="257" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">3. PIN invoeren</text>
  <line x1="360" y1="265" x2="470" y2="265" stroke="#dcfce7"/>
  <text x="415" y="280" text-anchor="middle" fill="#555" font-size="9">Persoonlijke code</text>
  <text x="415" y="293" text-anchor="middle" fill="#555" font-size="9">op het station.</text>
  <text x="415" y="306" text-anchor="middle" fill="#555" font-size="9">(2-factor: HEBT+WEET)</text>

  <line x1="480" y1="275" x2="505" y2="275" stroke="#22c55e" marker-end="url(#arr-g)"/>

  <!-- Stap 4: Decision -->
  <polygon points="570,245 610,275 570,305 530,275" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="570" y="272" text-anchor="middle" fill="#166534" font-size="9" font-weight="bold">Match</text>
  <text x="570" y="284" text-anchor="middle" fill="#166534" font-size="9" font-weight="bold">OK?</text>

  <!-- NO -->
  <line x1="570" y1="305" x2="570" y2="340" stroke="#ef4444" marker-end="url(#arr-r)"/>
  <rect x="530" y="342" width="80" height="25" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="570" y="359" text-anchor="middle" fill="#ef4444" font-size="9">Rood licht</text>

  <!-- YES -->
  <line x1="610" y1="275" x2="635" y2="275" stroke="#22c55e" marker-end="url(#arr-g)"/>

  <!-- Stap 5 -->
  <rect x="640" y="235" width="130" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="705" y="257" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">5. Bevestigen</text>
  <line x1="650" y1="265" x2="760" y2="265" stroke="#dcfce7"/>
  <text x="705" y="280" text-anchor="middle" fill="#555" font-size="9">Groen licht.</text>
  <text x="705" y="293" text-anchor="middle" fill="#555" font-size="9">Document tonen,</text>
  <text x="705" y="306" text-anchor="middle" fill="#555" font-size="9">bevestigen op station.</text>

  <line x1="770" y1="275" x2="795" y2="275" stroke="#22c55e" marker-end="url(#arr-g)"/>

  <!-- Stap 6 -->
  <rect x="800" y="235" width="130" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="865" y="257" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">6. Sealed</text>
  <line x1="810" y1="265" x2="920" y2="265" stroke="#bbf7d0"/>
  <text x="865" y="280" text-anchor="middle" fill="#555" font-size="9">Digitaal ondertekend.</text>
  <text x="865" y="293" text-anchor="middle" fill="#555" font-size="9">Onweerlegbaar bewijs</text>
  <text x="865" y="306" text-anchor="middle" fill="#555" font-size="9">direct beschikbaar.</text>

  <!-- ===== VERGELIJKING ===== -->
  <rect x="30" y="390" width="900" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="415" text-anchor="middle" fill="#334155" font-size="12" font-weight="bold">Wat verandert er?</text>

  <text x="80" y="440" fill="#333" font-size="10" font-weight="bold">Hetzelfde:</text>
  <text x="80" y="456" fill="#666" font-size="9">Persoon is fysiek aanwezig op locatie</text>
  <text x="80" y="470" fill="#666" font-size="9">Medewerker is aanwezig als getuige</text>
  <text x="80" y="484" fill="#666" font-size="9">Dezelfde locaties (notaris, gemeente, bank)</text>

  <line x1="340" y1="430" x2="340" y2="490" stroke="#e2e8f0"/>

  <text x="380" y="440" fill="#333" font-size="10" font-weight="bold">Anders:</text>
  <text x="380" y="456" fill="#666" font-size="9">ID-check digitaal i.p.v. visueel ("lijkt op u")</text>
  <text x="380" y="470" fill="#666" font-size="9">PIN vervangt handtekening als verificatie</text>
  <text x="380" y="484" fill="#666" font-size="9">Bewijs is digitaal en onvervalsbaar</text>

  <line x1="660" y1="430" x2="660" y2="490" stroke="#e2e8f0"/>

  <text x="700" y="440" fill="#166534" font-size="10" font-weight="bold">Meerwaarde:</text>
  <text x="700" y="456" fill="#166534" font-size="9">Objectief (machine i.p.v. mensenoog)</text>
  <text x="700" y="470" fill="#166534" font-size="9">2-factor (HEBT + WEET) i.p.v. 1-factor</text>
  <text x="700" y="484" fill="#166534" font-size="9">Direct digitaal archief, geen papier kwijt</text>
</svg>